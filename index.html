<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"/>
    <title>生日快乐</title>
    <link href="favicon.ico" rel="shortcut icon">

    <!-- 分享到微信/QQ 时的卡片信息，内容由 config.js 动态填充 -->
    <meta property="og:type" content="website"/>
    <meta property="og:title" id="og-title" content=""/>
    <meta property="og:description" id="og-desc" content=""/>
    <meta name="description" id="meta-desc" content=""/>

    <style>
        /* ------------------------------------------------------------
           设计令牌 · 凌晨两点的直播间
           暖黑打底，辣椒红做主色，暖白替代纯白。
           全站不用 #FFF / #000 —— 纯白纯黑会让画面变成印刷品，不是夜里。
           ------------------------------------------------------------ */

        :root {
            --ink-900: #1A1211;   /* 页面底 */
            --ink-800: #2A1C19;   /* 卡片底 */
            --ink-700: #3B2924;   /* 分隔 / 描边 */

            --red-600: #C42B20;   /* 按下 / 描边 */
            --red-500: #E23A2E;   /* 主色 */
            --red-400: #FF5546;   /* 高亮 / 数字 */

            --amber-400: #FFA53D; /* 舞台灯 */
            --amber-200: #FFD9A8;

            --cream-50:  #FFF4E6; /* 主文字（暖白） */
            --cream-300: #C9B8AE; /* 次级文字 */
            --mute:      #7A6B66; /* 日期 / 说明 */

            --sans: "PingFang SC", "HarmonyOS Sans SC", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", "Hiragino Sans GB", Avenir, "Helvetica Neue", Arial, sans-serif;
            --serif: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif SC", "SimSun", Georgia, serif;
            --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* 暗场五层，从近到远：
               颗粒 → 扫描线 → 顶部舞台灯 → 底部辣椒红余温 → 近黑暖灰底。
               颗粒和扫描线并进背景而不是单独做一层叠加：
               单独一层 + 混合模式会让每帧都要重新合成，实测掉 10fps。 */
            background-color: var(--ink-900);
            background-image:
                url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E"),
                repeating-linear-gradient(to bottom,
                    rgba(255, 244, 230, .014) 0 1px,
                    transparent 1px 4px),
                /* 顶光：从画面上方洒下来，居中。没有形状的光只有对称才立得住，
                   偏在一角就成一块污渍。 */
                radial-gradient(ellipse 68% 44% at 50% -14%,
                    rgba(255, 186, 120, .36), rgba(255, 150, 80, .11) 48%, transparent 74%),
                /* 左右各一点侧光，把画面横向撑开 */
                radial-gradient(ellipse 28% 52% at 5% 42%,
                    rgba(186, 62, 50, .12), transparent 72%),
                radial-gradient(ellipse 30% 56% at 96% 46%,
                    rgba(120, 52, 104, .16), transparent 72%),
                /* 底部辣椒红余温 */
                radial-gradient(ellipse 78% 34% at 50% 104%,
                    rgba(226, 58, 46, .30), transparent 72%),
                /* 内容区的光池：让中间那块"被照亮"，
                   否则大屏上文字是浮在虚空里 */
                radial-gradient(ellipse 46% 34% at 50% 46%,
                    rgba(226, 58, 46, .20), rgba(160, 44, 36, .07) 52%, transparent 76%),
                /* 基底：中间压住，让红色数字和粒子自己发光 */
                radial-gradient(ellipse at 50% 40%, #261A17 0%, #1B1412 54%, #110C0B 100%);
            background-size: 140px 140px, auto, auto, auto, auto, auto, auto, auto;
            background-repeat: repeat, repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
            font-family: var(--sans);
            -webkit-tap-highlight-color: transparent;
        }

        /* 舞台灯不单独做图层。带 clip-path 的梯形无论怎么模糊，
           边缘都会硬得像一块色板；光就放进背景里 —— 偏右上的一束椭圆光斑，
           看起来是"打上来的光"，而不是"画上去的形状"。 */

        /* ---------- 背景星空 ---------- */

        #stars {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ---------- 画布 ---------- */

        #canvas, .canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 烟花的贴图是彩虹配色，和这一版的红/暖金打架。
           用一层颜色矩阵整体压向暖色，不重绘贴图。
           颜色矩阵比模糊便宜得多，但仍然是每帧运算，低端机另算。 */
        #canvas { z-index: 8888; }
        .canvas { z-index: 9000; }

        /* 四周暗角，把视线聚到画面中央 */
        #vignette {
            position: absolute;
            inset: 0;
            z-index: 9100;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .55) 100%);
        }

        /* ---------- 引导层 ---------- */

        #intro {
            position: absolute;
            inset: 0;
            z-index: 9500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            cursor: pointer;
            background:
                radial-gradient(ellipse 44% 38% at 50% 50%,
                    rgba(20, 13, 12, .88) 0%, rgba(20, 13, 12, .68) 58%, rgba(20, 13, 12, .52) 100%),
                rgba(20, 13, 12, .55);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: opacity .8s ease;
        }

        #intro.intro--hidden {
            opacity: 0;
            pointer-events: none;
        }

        #intro-title {
            font-size: clamp(34px, 9.5vw, 68px);
            font-weight: 800;
            color: var(--cream-50);
            letter-spacing: .02em;
            text-shadow:
                0 6px 32px rgba(0, 0, 0, .9),
                0 0 60px rgba(226, 58, 46, .45);
            animation: float 3.6s ease-in-out infinite;
        }

        #intro-hint {
            font-family: var(--mono);
            font-size: clamp(11px, 3.2vw, 13px);
            color: rgba(255, 244, 230, .82);
            letter-spacing: .26em;
            padding: 10px 22px;
            background: rgba(20, 13, 12, .5);
            border: 1px solid rgba(255, 244, 230, .3);
            border-radius: 4px;
            animation: breathe 3.4s ease-in-out infinite;
        }

        /* 呼吸的红色指示灯 + 一行小字。
           倒数页和引导层共用 —— 这是"直播间待机"的那个标记。 */
        .mark {
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .3em;
            color: rgba(255, 244, 230, .8);
            text-shadow: 0 2px 14px rgba(0, 0, 0, .9);
        }

        .mark .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--red-500);
            box-shadow: 0 0 12px rgba(226, 58, 46, .85);
            animation: breathe 2.8s ease-in-out infinite;
        }

        #intro-error {
            display: none;
            font-size: 13px;
            color: #ffcf6b;
            letter-spacing: .05em;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }

        @keyframes breathe {
            0%, 100% { opacity: .55; transform: scale(1); }
            50%      { opacity: 1;   transform: scale(1.05); }
        }

        /* ---------- 右上 / 右下 控制按钮 ---------- */

        .fab {
            position: absolute;
            /* 必须高于引导层(9500)与倒数页(9500)：那两层都是铺满全屏的，
               否则按钮看得见却点不到 —— 显隐本来就由 display 控制，不靠层级 */
            z-index: 9550;
            display: none;              /* 引导层关闭后才显示 */
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            font-size: 12.5px;
            font-family: inherit;
            letter-spacing: .1em;
            color: rgba(255, 244, 230, .76);
            background: rgba(255, 244, 230, .045);
            border: 1px solid rgba(255, 244, 230, .15);
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background .25s, border-color .25s, color .25s, transform .25s;
        }

        /* 图标用等宽字形，不用 emoji：emoji 一带颜色就变成"礼物模板"了 */
        .fab-ico {
            font-style: normal;
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1;
            opacity: .6;
            transition: opacity .25s, color .25s;
        }

        .fab:hover {
            color: var(--cream-50);
            background: rgba(226, 58, 46, .16);
            border-color: rgba(226, 58, 46, .5);
            transform: translateY(-2px);
        }

        .fab:hover .fab-ico { opacity: 1; color: var(--red-400); }

        body.started .fab { display: inline-flex; }

        /* 倒数页里的按钮不受 body.started 控制，常显 */
        .fab--static {
            position: static;
            display: inline-flex;
        }

        #btn-mute  { top: 20px;    right: 20px; }
        #btn-danmaku { top: 68px;  right: 20px; }
        #btn-album { bottom: 24px; right: 20px; }
        #btn-timeline { bottom: 24px; left: 20px; }
        #btn-people { bottom: 78px; left: 20px; }

        /* 关闭状态：图标去色、整体压暗，一眼能看出是关的 */
        .fab--off {
            opacity: .5;
            filter: grayscale(1);
        }

        /* 倒数页模式下只显示音乐按钮，其余入口在页面内 */
        body.countdown-mode #btn-mute { display: inline-flex; }

        /* ---------- 回忆相册 ---------- */

        .carousel-modal {
            position: fixed;
            inset: 0;
            z-index: 9800;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 13, 12, .88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s ease;
        }

        .carousel-modal--visible {
            opacity: 1;
            pointer-events: auto;
        }

        .carousel-box {
            position: relative;
            width: min(88vw, 720px);
        }

        .carousel-viewport {
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .6);
        }

        .carousel-track {
            display: flex;
            transition: transform .45s cubic-bezier(.22, .61, .36, 1);
        }

        .carousel-slide {
            position: relative;
            flex: 0 0 100%;
            aspect-ratio: 5 / 3;
            background: var(--ink-800);
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .carousel-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(255, 244, 230, .95);
            text-align: center;
        }

        .carousel-placeholder-num {
            font-size: clamp(40px, 9vw, 72px);
            font-weight: 700;
            opacity: .5;
        }

        .carousel-placeholder-tip {
            font-size: 13px;
            line-height: 1.7;
            opacity: .85;
            padding: 0 16px;
        }

        .carousel-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 32px 20px 16px;
            font-size: clamp(14px, 3.4vw, 18px);
            color: #FFF4E6;
            text-align: center;
            letter-spacing: .06em;
            background: linear-gradient(to top, rgba(0, 0, 0, .7), transparent);
        }

        .carousel-btn, .carousel-close {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF4E6;
            background: rgba(0, 0, 0, .45);
            border: 1px solid rgba(255, 244, 230, .2);
            border-radius: 50%;
            cursor: pointer;
            transition: background .2s;
        }

        .carousel-btn:hover, .carousel-close:hover {
            background: rgba(0, 0, 0, .75);
        }

        .carousel-btn {
            top: 50%;
            width: 44px;
            height: 44px;
            margin-top: -22px;
            font-size: 16px;
        }

        .carousel-prev { left: -22px; }
        .carousel-next { right: -22px; }

        .carousel-close {
            top: -18px;
            right: -18px;
            width: 36px;
            height: 36px;
            font-size: 22px;
            line-height: 1;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .carousel-dot {
            width: 10px;
            height: 10px;
            padding: 0;
            background: rgba(255, 244, 230, .3);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }

        .carousel-dot--active {
            background: #FFF4E6;
            transform: scale(1.35);
        }

        /* 窄屏时把左右按钮收进画面内，避免溢出屏幕 */
        @media (max-width: 640px) {
            .carousel-prev  { left: 8px; }
            .carousel-next  { right: 8px; }
            .carousel-close { top: -46px; right: 0; }
        }

        /* ---------- 轻提示 ---------- */

        #toast {
            position: fixed;
            left: 50%;
            bottom: 88px;
            z-index: 9700;
            max-width: 82vw;
            padding: 12px 20px;
            font-size: 14px;
            line-height: 1.5;
            color: #FFF4E6;
            text-align: center;
            white-space: normal;
            background: rgba(20, 16, 17, .96);
            border: 1px solid rgba(255, 244, 230, .2);
            border-radius: 12px;
            transform: translate(-50%, 12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease, transform .3s ease;
        }

        #toast.toast--visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ---------- 倒数页（非生日期间显示）---------- */

        #countdown-page {
            position: absolute;
            inset: 0;
            z-index: 9500;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            text-align: center;
            padding: 0 24px;
        }

        #countdown-page.cd--visible { display: flex; }

        /* 数字背后的红色余晖。粒子层在倒数页是关掉的，
           这团光是代替它站在数字后面的东西。 */
        #countdown-page::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(88vw, 720px);
            height: min(70vw, 560px);
            transform: translate(-50%, -54%);
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                rgba(226, 58, 46, .20) 0%,
                rgba(226, 58, 46, .07) 42%,
                transparent 70%);
        }

        #countdown-page > * { position: relative; }

        #cd-label {
            font-family: var(--mono);
            font-size: clamp(11px, 3.2vw, 12.5px);
            color: rgba(255, 244, 230, .45);
            letter-spacing: .16em;
            text-shadow: 0 2px 16px rgba(0, 0, 0, .9);
        }

        /* 倒数模式：把粒子层降权，让数字成为唯一主角。
           v1 的硬伤是爱心把标题和「天」压住，几乎读不出来。
           现在爱心退成数字背后的一团光，仍然是它，但不再抢。 */

        body.countdown-mode #canvas,
        body.countdown-mode .canvas {
            opacity: 0;
            transform: scale(.68) translateY(7%);
            transform-origin: 50% 46%;
            filter: saturate(.9);
            transition: opacity .9s ease, transform .9s ease;
        }

        /* 倒数页盖在画布上，只让按钮接收点击 */
        body.countdown-mode #countdown-page { pointer-events: none; }
        body.countdown-mode #countdown-page button { pointer-events: auto; }

        #cd-number {
            display: flex;
            align-items: baseline;
            gap: 14px;
            color: var(--cream-50);
        }

        #cd-days {
            font-size: clamp(96px, 22vw, 200px);
            font-weight: 800;
            line-height: .92;
            letter-spacing: -.02em;
            font-variant-numeric: tabular-nums;
            color: var(--red-400);
            text-shadow:
                0 0 6px rgba(226, 58, 46, .5),
                0 0 48px rgba(226, 58, 46, .45),
                0 0 140px rgba(226, 58, 46, .22);
        }

        #cd-unit {
            font-family: var(--mono);
            font-size: clamp(14px, 4vw, 20px);
            letter-spacing: .1em;
            color: rgba(255, 244, 230, .45);
        }

        /* 生日当天但演出尚未开始时，用这行替代数字 */
        #cd-today {
            font-size: clamp(30px, 8vw, 56px);
            font-weight: 800;
            color: var(--red-400);
            letter-spacing: .04em;
            text-shadow: 0 0 40px rgba(226, 58, 46, .6);
            animation: float 3.2s ease-in-out infinite;
        }

        #cd-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 14px;
        }

        /* ---------- 时光轴 ---------- */

        .tl-modal {
            position: fixed;
            inset: 0;
            z-index: 9850;
            background:
                /* 面板自己的两层光：顶部一盏、底部一层红，
                   让它看起来是"这个房间里的一个暗处"，而不是一块黑纸 */
                radial-gradient(ellipse 62% 44% at 50% -10%,
                    rgba(255, 172, 100, .13), transparent 66%),
                radial-gradient(ellipse 40% 60% at 104% 56%,
                    rgba(126, 48, 100, .10), transparent 70%),
                radial-gradient(ellipse 74% 46% at 50% 108%,
                    rgba(226, 58, 46, .14), transparent 72%),
                rgba(20, 13, 12, .975);
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s ease;
        }

        .tl-modal--visible {
            opacity: 1;
            pointer-events: auto;
        }

        .tl-scroll {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .tl-inner {
            max-width: 760px;
            margin: 0 auto;
            padding: 72px 20px 60px;
        }

        .tl-close {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 2;
            width: 40px;
            height: 40px;
            font-size: 24px;
            line-height: 1;
            color: #FFF4E6;
            background: rgba(255, 244, 230, .12);
            border: 1px solid rgba(255, 244, 230, .25);
            border-radius: 50%;
            cursor: pointer;
        }

        .tl-close:hover { background: rgba(255, 244, 230, .24); }

        /* 每一年之间用竖线连起来，形成时间轴的视觉 */
        .tl-year {
            position: relative;
            padding: 0 0 64px 0;
        }

        .tl-year:not(:last-of-type)::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 24px;
            width: 1px;
            height: 32px;
            background: linear-gradient(to bottom, rgba(255, 244, 230, .35), transparent);
        }

        .tl-head {
            text-align: center;
            margin-bottom: 26px;
        }

        .tl-year-num {
            font-size: clamp(38px, 11vw, 64px);
            font-weight: 700;
            color: #FFF4E6;
            line-height: 1;
            letter-spacing: .04em;
            text-shadow: 0 0 30px rgba(226, 58, 46, .45);
        }

        .tl-headline {
            margin-top: 10px;
            font-size: clamp(14px, 3.6vw, 17px);
            color: rgba(255, 244, 230, .65);
            letter-spacing: .08em;
        }

        /* 「今年」标签：只有最新那一年有 */
        .tl-year-tag {
            display: inline-block;
            margin-top: 8px;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 11px;
            letter-spacing: .14em;
            color: rgba(255, 244, 230, .8);
            background: rgba(255, 244, 230, .12);
            border: 1px solid rgba(255, 244, 230, .18);
        }

        /* 这一年的坐标：粉丝数，只做注脚 */
        .tl-snap {
            margin-top: 10px;
            font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: .06em;
            color: rgba(255, 244, 230, .45);
        }

        /* ---------- 里程碑 ----------
           年鉴的主体。左边日期、中间圆点、右边内容，
           竖线把它们串成一条时间线。 */

        .tl-miles {
            position: relative;
            margin: 0 0 30px 0;
            padding-left: 20px;
        }

        .tl-miles::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 6px;
            bottom: 6px;
            width: 1px;
            background: linear-gradient(to bottom,
                rgba(255, 244, 230, .28),
                rgba(255, 244, 230, .10));
        }

        .tl-mile {
            position: relative;
            padding: 0 0 16px 0;
        }

        .tl-mile:last-child { padding-bottom: 0; }

        .tl-mile::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 7px;
            width: 9px;
            height: 9px;
            margin-left: -1px;
            border-radius: 50%;
            background: rgba(255, 244, 230, .55);
            box-shadow: 0 0 10px rgba(226, 58, 46, .55);
        }

        /* 按类型给圆点上色，扫一眼能分出「投稿 / 直播 / 数据 / 生日」 */
        .tl-mile--work::before      { background: #FFB271; }   /* 投稿 · 琥珀 */
        .tl-mile--live::before      { background: #FF6B5A; }   /* 直播 · 红 */
        .tl-mile--milestone::before { background: #FFD9A8; }   /* 数据 · 暖金 */
        .tl-mile--birthday::before  { background: #FF5546; box-shadow: 0 0 16px rgba(226, 58, 46, .9); }
        .tl-mile--meme::before      { background: #C9B8AE; }   /* 梗 · 沙 */
        .tl-mile--me::before        { background: #FFF4E6; box-shadow: 0 0 14px rgba(255, 244, 230, .9); }

        .tl-mile-date {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .08em;
            color: rgba(255, 244, 230, .52);
        }

        .tl-mile-title {
            display: block;
            margin-top: 3px;
            font-size: clamp(14px, 3.8vw, 16px);
            color: rgba(255, 244, 230, .94);
            line-height: 1.5;
            text-decoration: none;
        }

        a.tl-mile-title:hover { text-decoration: underline; }

        .tl-mile-note {
            display: block;
            margin-top: 3px;
            font-size: 12.5px;
            color: rgba(255, 244, 230, .62);
            line-height: 1.6;
        }

        .tl-photos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            margin-bottom: 26px;
        }

        .tl-photo {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            background: var(--ink-800);
        }

        .tl-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .tl-photo-ph {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            color: rgba(255, 244, 230, .55);
        }

        .tl-photo-cap {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 22px 12px 9px;
            font-size: 13px;
            color: #FFF4E6;
            background: linear-gradient(to top, rgba(0, 0, 0, .78), transparent);
        }

        .tl-quotes { margin-bottom: 24px; }

        .tl-quote {
            margin: 0 0 14px;
            padding: 16px 20px;
            background: rgba(255, 244, 230, .06);
            border-left: 3px solid rgba(226, 58, 46, .75);

        .tl-quote-text {

        .tl-quote-from {
            display: block;

            font-style: normal;
            color: rgba(255, 244, 230, .5);
            letter-spacing: .06em;
        }

        .tl-letter {
            padding: 20px 22px;
            background: rgba(255, 244, 230, .04);
            border: 1px solid rgba(255, 244, 230, .1);
            border-radius: 12px;
        }

        .tl-letter p {
            margin: 0 0 12px;
            font-size: clamp(14px, 3.7vw, 16px);
            line-height: 1.95;
            color: rgba(255, 244, 230, .82);
        }

        .tl-letter p:last-child { margin-bottom: 0; }

        .tl-empty {
            padding: 70px 20px;
            text-align: center;
            font-size: 16px;
            line-height: 2;
            color: rgba(255, 244, 230, .6);
        }

        .tl-empty span {
            font-size: 13px;
            color: rgba(255, 244, 230, .38);
        }

        .tl-footer {
            margin-top: 40px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 244, 230, .1);
            text-align: center;
            font-size: 12px;
            line-height: 1.9;
            color: rgba(255, 244, 230, .4);
        }

        /* ---------- 陪你的人 ----------
           两个视角：我和大家。和时光轴同一套暗底，但用白点区分。 */

        .pp-modal {
            position: fixed;
            inset: 0;
            z-index: 9810;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                /* 面板自己的两层光：顶部一盏、底部一层红，
                   让它看起来是"这个房间里的一个暗处"，而不是一块黑纸 */
                radial-gradient(ellipse 62% 44% at 50% -10%,
                    rgba(255, 172, 100, .13), transparent 66%),
                radial-gradient(ellipse 40% 60% at 104% 56%,
                    rgba(126, 48, 100, .10), transparent 70%),
                radial-gradient(ellipse 74% 46% at 50% 108%,
                    rgba(226, 58, 46, .14), transparent 72%),
                rgba(20, 13, 12, .975);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s ease;
        }

        .pp-modal--visible {
            opacity: 1;
            pointer-events: auto;
        }

        .pp-scroll {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .pp-inner {
            width: min(92vw, 880px);
            margin: 0 auto;
            padding: 64px 20px 80px;
        }

        .pp-close {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 2;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 244, 230, .22);
            background: rgba(255, 244, 230, .1);
            color: #FFF4E6;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            transition: background .25s;
        }

        .pp-close:hover { background: rgba(255, 244, 230, .24); }

        .pp-head {
            text-align: center;
            margin-bottom: 42px;
        }

        .pp-title {
            font-size: clamp(28px, 7vw, 42px);
            font-weight: 700;
            color: #FFF4E6;
            letter-spacing: .06em;
            text-shadow: 0 0 26px rgba(255, 244, 230, .3);
        }

        .pp-desc {
            margin-top: 12px;
            font-size: clamp(13px, 3.4vw, 15px);
            line-height: 1.9;
            color: rgba(255, 244, 230, .55);
        }

        .pp-sec { margin-bottom: 46px; }

        .pp-h {
            margin: 0 0 6px;
            font-size: clamp(22px, 5.5vw, 30px);
            font-weight: 700;
            color: #FFF4E6;
            letter-spacing: .1em;
        }

        .pp-h3 {
            margin: 0 0 6px;
            font-size: clamp(15px, 4vw, 18px);
            font-weight: 600;
            color: rgba(255, 244, 230, .9);
            letter-spacing: .05em;
        }

        .pp-sub {
            margin: 0 0 20px;
            font-size: 13px;
            line-height: 1.85;
            color: rgba(255, 244, 230, .45);
            max-width: 46em;
        }

        .pp-group { margin-bottom: 38px; }

        /* 我的线：白色圆点，跟年鉴的彩色点区分 */
        .pp-line {
            position: relative;
            padding-left: 22px;
        }

        .pp-line::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 8px;
            bottom: 8px;
            width: 1px;
            background: linear-gradient(to bottom,
                rgba(255, 244, 230, .6),
                rgba(255, 244, 230, .12));
        }

        .pp-node {
            position: relative;
            padding-bottom: 22px;
        }

        .pp-node:last-child { padding-bottom: 0; }

        .pp-node::before {
            content: '';
            position: absolute;
            left: -22px;
            top: 6px;
            width: 9px;
            height: 9px;
            margin-left: -1px;
            border-radius: 50%;
            background: #FFF4E6;
            box-shadow: 0 0 12px rgba(255, 244, 230, .8);
        }

        .pp-node-date {
            font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: .08em;
            color: rgba(255, 244, 230, .42);
        }

        .pp-node-title {
            display: block;
            margin-top: 3px;
            font-size: clamp(15px, 4vw, 17px);
            color: #FFF4E6;
            line-height: 1.5;
            text-decoration: none;
        }

        a.pp-node-title:hover { text-decoration: underline; }

        .pp-node-note {
            margin-top: 3px;
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255, 244, 230, .55);
        }

        .pp-node-meta {
            margin-top: 4px;
            font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: .05em;
            color: rgba(255, 244, 230, .3);
        }

        /* 大家的卡片：文字卡片，不放封面（不盗链） */
        .pp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
            gap: 10px;
        }

        .pp-card {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 14px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 244, 230, .1);
            background: rgba(255, 244, 230, .04);
            text-decoration: none;
            transition: background .22s, border-color .22s, transform .22s;
        }

        .pp-card:hover {
            background: rgba(255, 244, 230, .09);
            border-color: rgba(255, 244, 230, .26);
            transform: translateY(-2px);
        }

        .pp-card-bv {
            font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
            font-size: 10.5px;
            letter-spacing: .1em;
            color: rgba(255, 244, 230, .3);
        }

        .pp-card-title {
            font-size: 14.5px;
            line-height: 1.55;
            color: rgba(255, 244, 230, .95);
        }

        .pp-card-meta {
            font-size: 11.5px;
            color: rgba(255, 244, 230, .45);
        }

        .pp-card-note {
            font-size: 11.5px;
            line-height: 1.6;
            color: rgba(255, 244, 230, .62);
            padding-top: 2px;
            border-top: 1px dashed rgba(255, 244, 230, .12);
            margin-top: 2px;
        }

        .pp-tip {
            margin: 26px 0 0;
            font-size: 11.5px;
            line-height: 1.8;
            color: rgba(255, 244, 230, .32);
        }

        .pp-empty {
            padding: 60px 20px;
            text-align: center;
            color: rgba(255, 244, 230, .5);
        }

        .pp-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 244, 230, .1);
            text-align: center;
            font-size: 12px;
            line-height: 1.9;
            color: rgba(255, 244, 230, .4);
        }

        /* ---------- 打字机长信 ---------- */

        #letter {
            position: fixed;
            inset: 0;
            /* 9600 → 9760：必须压在 #toast(9700) 上面。
               手机上「点击右上角的按钮可以开启音乐」那条提示会正好落在信上，
               之前 z-index 比信高，直接盖住正文。 */
            z-index: 9760;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            /* 这里原本有 backdrop-filter: blur(6px)。
               它让每一帧都把底下正在播放的粒子/烟花整屏重算一次模糊 ——
               实测 61fps 直接掉到 24fps。而遮罩本身已经接近不透明，
               模糊出来的内容几乎为零，纯亏。去掉，把遮罩加深补回层次。
               （DESIGN §6 那条「运动 canvas 上加 blur 是灾难」，这里是同一个坑。） */
            background:
                /* 面板自己的两层光：顶部一盏、底部一层红，
                   让它看起来是"这个房间里的一个暗处"，而不是一块黑纸 */
                radial-gradient(ellipse 62% 44% at 50% -10%,
                    rgba(255, 172, 100, .13), transparent 66%),
                radial-gradient(ellipse 40% 60% at 104% 56%,
                    rgba(126, 48, 100, .10), transparent 70%),
                radial-gradient(ellipse 74% 46% at 50% 108%,
                    rgba(226, 58, 46, .14), transparent 72%),
                rgba(20, 13, 12, .975);
            opacity: 0;
            pointer-events: none;
            transition: opacity .7s ease;
        }

        #letter.letter--visible {
            opacity: 1;
            pointer-events: auto;
        }

        .letter-box {
            position: relative;
            /* 560 → 620：可用行宽 500 → 560，约 31 字/行。
               中文每字 ≈ 字号宽，560 的箱子一行只放得下 27 字，
               而信里最长的句子是 30 字 —— 会折成"最后两个字掉到下一行"，
               一句一行的手写感就没了。宽一点更耐读。 */
            width: min(92vw, 620px);
            max-height: 86vh;
            display: flex;
            flex-direction: column;
            padding: 32px 30px 20px;
            background: linear-gradient(180deg,
                rgba(255, 244, 230, .085) 0%,
                rgba(255, 244, 230, .035) 100%);
            border: 1px solid rgba(255, 244, 230, .13);
            border-radius: 4px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, .6);
            cursor: pointer;
        }

        .letter-close {
            position: absolute;
            top: -16px;
            right: -16px;
            width: 34px;
            height: 34px;
            font-size: 20px;
            line-height: 1;
            color: #FFF4E6;
            background: rgba(20, 16, 17, .96);
            border: 1px solid rgba(255, 244, 230, .28);
            border-radius: 50%;
            cursor: pointer;
            transition: background .2s;
        }

        .letter-close:hover { background: rgba(196, 43, 32, .95); }

        .letter-body {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            /* flex 子项默认 min-height:auto，会拒绝收缩 —— 不写这两行，
               内容溢出 letter-box，最后一行被按钮压成半截字。 */
            flex: 1 1 auto;
            min-height: 0;
        }

        /* 全站唯一的衬线。换字体是最省力也最有效的"私密"信号。 */
        .letter-body p {
            margin: 0 0 6px;
            font-family: var(--serif);
            font-size: clamp(15px, 3.7vw, 17px);
            line-height: 1.95;
            color: rgba(255, 244, 230, .9);
            letter-spacing: .04em;
        }

        /* 信里的空行 = 段落间隔。给它一个确定的高度，别指望空 <p> 自己撑开。 */
        .letter-body p.letter-gap {
            height: 18px;
            margin: 0 0 6px;
        }

        /* 正在打字的那一段末尾显示光标 */
        .letter-body p:last-child::after {
            content: '';
            display: inline-block;
            width: 2px;
            height: 1em;
            margin-left: 3px;
            vertical-align: -0.15em;
            background: rgba(226, 58, 46, .95);
            animation: caret 1s step-end infinite;
        }

        #letter.letter--done .letter-body p:last-child::after {
            display: none;
        }

        @keyframes caret {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        .letter-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
        }

        .letter-skip {
            padding: 7px 16px;
            font-size: 13px;
            font-family: inherit;
            color: rgba(255, 244, 230, .7);
            background: transparent;
            border: 1px solid rgba(255, 244, 230, .25);
            border-radius: 999px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .letter-skip:hover {
            background: rgba(255, 244, 230, .12);
            color: #FFF4E6;
        }

        /* 打完字后「跳过」改为「关闭」语义，并浮出主按钮 */
        #letter.letter--done .letter-skip { display: none; }

        .letter-done {
            display: none;
            padding: 9px 22px;
            font-size: 14px;
            font-family: inherit;
            color: #0B0909;
            background: linear-gradient(135deg, #FFB271, #FF5546);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(226, 58, 46, .35);
            transition: transform .2s, box-shadow .2s;
        }

        .letter-done:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(226, 58, 46, .48);
        }

        #letter.letter--done .letter-done {
            display: inline-block;
            animation: pop .5s cubic-bezier(.34, 1.56, .64, 1);
        }

        /* 只给「收下这封信」用。三连那边已经不用整块弹跳了 —— 见三连彩蛋那段注释。 */
        @keyframes pop {
            0%   { transform: scale(1); }
            45%  { transform: scale(1.28); }
            100% { transform: scale(1); }
        }

        /* ---------- 三连彩蛋 ----------
           三个小按钮 + 一个「一键三连」。语言跟信纸同一套：1px 细边、
           极低对比玻璃、pill 圆角。图标全部是内联 SVG 描边。

           上一版的三处问题，记在这里免得改回去：
           1. 图标用系统 emoji（👍🪙⭐）。彩色、圆润、自带立体感，
              在这套深色红金 + 衬线的画面里是贴纸。
           2. 完成时整组按钮 pop 到 1.28 倍，同时 24 个 emoji 从屏幕顶端落下。
              整块 UI 弹跳会让整个界面跟着抖；而"从天上掉雨"跟"我按了三下"没关系。
           3. 没有一键三连。 */

        #triple {
            position: fixed;
            /* 左右都锚住 + 内部居中，不要用 left:50% + translateX(-50%)：
               fixed 元素在 left:50% 之后，shrink-to-fit 的可用宽度只剩半屏，
               窄屏上四个按钮被压进 256px 里，文字直接竖排。 */
            left: 0;
            right: 0;
            bottom: calc(26px + env(safe-area-inset-bottom, 0px));
            z-index: 9400;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transform: translateY(14px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .6s ease,
                        transform .6s cubic-bezier(.22, .61, .36, 1),
                        visibility .6s;
        }

        /* 入场：从下方轻轻浮上来。之前 display:none → flex 是瞬间蹦出，没有过渡。 */
        #triple.triple--visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }

        .triple-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            height: 40px;
            padding: 0 15px;
            font-family: inherit;
            font-size: 12.5px;
            letter-spacing: .05em;
            white-space: nowrap;
            color: rgba(255, 244, 230, .55);
            background: rgba(255, 244, 230, .045);
            border: 1px solid rgba(255, 244, 230, .14);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: color .3s, background .3s, border-color .3s,
                        box-shadow .4s, transform .25s;
        }

        .triple-btn:hover {
            color: rgba(255, 244, 230, .88);
            background: rgba(255, 244, 230, .085);
        }

        .triple-btn:active { transform: scale(.96); }

        .triple-btn svg,
        .triple-all svg {
            width: 15px;
            height: 15px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 点亮：不铺红色底块，只把颜色和一圈极淡的辉光烧起来 */
        .triple-btn--on {
            color: #FFE8D6;
            background: rgba(226, 58, 46, .15);
            border-color: rgba(255, 85, 70, .48);
            box-shadow: inset 0 0 0 1px rgba(226, 58, 46, .16),
                        0 0 18px rgba(226, 58, 46, .2);
        }

        /* 点亮瞬间只动图标。整块按钮弹跳会让整个界面跟着抖一下 —— 那是之前丑的主因。 */
        .triple-btn--on svg { animation: iconSpark .55s ease-out; }
        .triple-btn--on svg * { fill: rgba(255, 85, 70, .16); }

        @keyframes iconSpark {
            0%   { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(255, 85, 70, 0)); }
            32%  { transform: scale(1.24); filter: drop-shadow(0 0 6px rgba(255, 85, 70, .9)); }
            100% { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(255, 85, 70, 0)); }
        }

        /* 一键三连：主按钮，跟「收下这封信」用同一个渐变，读完信的人认得出它 */
        .triple-all {
            display: flex;
            align-items: center;
            gap: 7px;
            height: 40px;
            padding: 0 20px;
            font-family: inherit;
            font-size: 13px;
            letter-spacing: .06em;
            white-space: nowrap;
            color: #0B0909;
            background: linear-gradient(135deg, #FFB271, #FF5546);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(226, 58, 46, .3);
            transition: transform .2s, box-shadow .2s, opacity .35s, background .35s;
        }

        .triple-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(226, 58, 46, .42);
        }

        .triple-all:active { transform: translateY(0) scale(.98); }

        /* 完成后整组退到背景里，不再抢画面 */
        #triple.triple--complete .triple-btn {
            opacity: .42;
            pointer-events: none;
        }

        #triple.triple--complete .triple-all {
            color: rgba(255, 244, 230, .62);
            background: rgba(255, 244, 230, .06);
            box-shadow: none;
            pointer-events: none;
        }

        /* 完成瞬间：一团柔光从按钮位置向外爆开，替代原来的整组弹跳。
           不用 1px 细圆环 —— 扩到近千像素时那根线早就透明了，等于没有反馈。 */
        .triple-ring {
            position: fixed;
            left: 50%;
            bottom: calc(46px + env(safe-area-inset-bottom, 0px));
            z-index: 9399;
            width: 240px;
            height: 240px;
            margin: 0 0 -120px -120px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle,
                        rgba(255, 196, 156, .72) 0%,
                        rgba(255, 110, 80, .44) 30%,
                        rgba(226, 58, 46, .16) 55%,
                        transparent 72%);
            animation: ringOut .95s cubic-bezier(.15, .75, .3, 1) forwards;
        }

        @keyframes ringOut {
            0%   { transform: scale(.1); opacity: 1; }
            100% { transform: scale(1.75); opacity: 0; }
        }

        /* 飘起的符号：起点就在按钮上，向上走，各自横向散开。
           用 ♥ ✦ 这些衬线可渲染的字符，不用 emoji。 */
        .triple-burst {
            position: fixed;
            inset: 0;
            z-index: 9750;
            overflow: hidden;
            pointer-events: none;
        }

        .triple-burst span {
            position: absolute;
            bottom: calc(54px + env(safe-area-inset-bottom, 0px));
            font-family: var(--serif);
            font-size: 16px;
            line-height: 1;
            color: rgba(255, 150, 116, .98);
            text-shadow: 0 0 10px rgba(255, 85, 70, .85),
                         0 0 26px rgba(226, 58, 46, .5);
            will-change: transform, opacity;
            animation: riseFade 2.1s cubic-bezier(.2, .7, .3, 1) forwards;
        }

        @keyframes riseFade {
            0%   { transform: translate3d(0, 12px, 0) scale(.45) rotate(0deg); opacity: 0; }
            14%  { opacity: 1; }
            70%  { opacity: .9; }
            100% { transform: translate3d(var(--dx, 0px), -26vh, 0) scale(1.05) rotate(var(--rot, 0deg)); opacity: 0; }
        }

        /* 窄屏：三个小按钮只留图标，把宽度让给主按钮。
           阈值放在 560 而不是 430 —— 430 时个别机型（或缩放后的视口）仍然挤。 */
        @media (max-width: 560px) {
            #triple { gap: 8px; padding: 0 12px; }
            .triple-btn { padding: 0 13px; gap: 0; }
            .triple-btn span { display: none; }
            .triple-all { padding: 0 18px; font-size: 12.5px; }

            /* 手机上一封 260 字的信必然要滚，但可以把行距收一点，
               少滚一半。桌面保持舒展。 */
            .letter-box { padding: 26px 20px 16px; }
            .letter-body p { line-height: 1.85; margin-bottom: 5px; font-size: 15px; }
            .letter-body p.letter-gap { height: 13px; }
        }

        /* ---------- 头像入场：白光闪烁 ---------- */

        #flash {
            position: absolute;
            inset: 0;
            z-index: 9300;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at 50% 50%,
                        rgba(255, 244, 230, .9) 0%,
                        rgba(255, 176, 140, .42) 35%,
                        transparent 70%);
        }

        #flash.flash--on {
            animation: flash-in 1.1s ease-out;
        }

        @keyframes flash-in {
            0%   { opacity: 0;   transform: scale(.7); }
            18%  { opacity: .95; transform: scale(1);  }
            100% { opacity: 0;   transform: scale(1.5); }
        }
    </style>
</head>

<script>
    // ---------- 环境判断 ----------

    var UA = navigator.userAgent.toLowerCase(),
        isWeixin = /micromessenger/.test(UA),
        isMobile = /android|iphone|ipad|ipod|harmony/.test(UA) || window.innerWidth < 640;

    // ---------- 把当年数据注入粒子引擎 ----------
    // js/index.js 读的是 CONFIG，这里用当年的 data 覆盖它的内容字段

    (function () {
        var y = HB.featured();
        if (!y) return;

        if (y.messages && y.messages.length) CONFIG.messages = y.messages;
        if (y.icons && y.icons.length)       CONFIG.icons = y.icons;
        if (y.countdown != null)             CONFIG.countdown = y.countdown;
        if (y.photos)                        CONFIG.photos = y.photos;
    }());

    // ---------- 页面文案 ----------

    document.title = SITE.fill(SITE.title);
    document.getElementById('intro-title').textContent = SITE.fill(SITE.intro.title);
    document.getElementById('intro-hint').textContent = SITE.fill(SITE.intro.hint);

    // 分享卡片信息
    (function () {
        var desc = SITE.fill(SITE.description || '');
        document.getElementById('og-title').content = document.title;
        document.getElementById('og-desc').content = desc;
        document.getElementById('meta-desc').content = desc;

        // 未开放收录时插入 noindex，与 robots.txt 双重保险
        if (!SITE.allowIndexing) {
            var m = document.createElement('meta');
            m.name = 'robots';
            m.content = 'noindex, nofollow';
            document.head.appendChild(m);
        }
    }());

    var started = false;

    function toast(msg, ms) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('toast--visible');
        clearTimeout(toast._t);
        toast._t = setTimeout(function () {
            el.classList.remove('toast--visible');
        }, ms || 4000);
    }

    function start() {
        if (started) return;
        started = true;

        var intro = document.getElementById('intro');
        intro.classList.add('intro--hidden');
        // 淡出结束后彻底移出布局，避免它挡住下方的相册按钮
        setTimeout(function () { intro.style.display = 'none'; }, 800);

        document.body.classList.add('started');

        init(0);            // 切换粒子文字到正式祝福序列
        playMusic();
        runShow();          // 安排弹幕、长信、三连的出场时机
    }

    // 整段演出的编排：祝福语 → 头像 → 弹幕 → 长信 → 三连
    function runShow() {
        var y = HB.featured(),
            cfg = SITE.show || {},
            tl = CONFIG.timeline();

        if (!y) return;

        // 弹幕：祝福语开场后不久放出，与粒子文字并行
        if (y.danmaku && y.danmaku.length) {
            setTimeout(function () {
                Danmaku.start(y.danmaku);
            }, cfg.danmakuDelay == null ? 6000 : cfg.danmakuDelay);

            // 头像高潮时让路：提前 2 秒淡出，高潮结束后淡回来。
            // 淡出期间不再发射新弹幕，画面彻底干净。
            if (tl.portraitStart != null) {
                var lead = cfg.danmakuFadeLead == null ? 2000 : cfg.danmakuFadeLead;

                setTimeout(function () { Danmaku.fadeOut(); },
                           Math.max(0, tl.portraitStart - lead));
                setTimeout(function () { Danmaku.fadeIn(); }, tl.portraitEnd);
            }
        }

        // 长信：整段祝福播完后浮出
        var lines = y.letter;
        if (lines && (typeof lines === 'string' ? lines.trim() : lines.length)) {
            var delay = tl.total + (cfg.letterDelay == null ? 2500 : cfg.letterDelay);

            setTimeout(function () {
                Letter.show(lines, y.year, null, function () {
                    // 信纸收起之后才放三连。
                    // 之前是在打字完成（onDone）时就 mount —— 那时信还盖着画面，
                    // 三连的 z-index(9400) 低于信纸(9600)，只会在信下面露一角。
                    if (cfg.triple !== false) Triple.mount();

                    // 画面重新露出，这时才提示可以点击切换
                    hintToggle();
                });
            }, delay);
        } else {
            if (cfg.triple !== false) {
                setTimeout(function () { Triple.mount(); }, tl.total);
            }
            // 没有信的年份，祝福播完就提示
            setTimeout(hintToggle, tl.total + 1200);
        }
    }

    // ---------- 结束后的自由切换：爱心 ↔ 头像 ----------

    var canToggle = false,
        showingPortrait = false,
        hinted = false;

    // 由 js/index.js 在整段序列播完后回调
    window.onSequenceEnd = function () {
        if (!started) return;      // 待机序列结束不算
        canToggle = true;
    };

    function hintToggle() {
        if (!canToggle || hinted) return;
        hinted = true;
        toast('👆 点一下画面，看看会变成什么', 5000);
    }

    function toggleShape() {
        if (!canToggle) return;

        showingPortrait = !showingPortrait;

        if (showingPortrait) {
            S.UI.showPortrait();
        } else {
            // 变回序列结尾那个图标
            var y = HB.featured(),
                icons = (y && y.icons) || ['heart'];
            S.UI.showIcon(icons[icons.length - 1]);
        }
    }

    // 音乐播放失败不回滚动画——祝福照常进行，只提示音乐状态
    function playMusic() {
        var audio = document.getElementById('audios');

        function attempt() {
            var p = audio.play();

            if (p && typeof p.catch === 'function') {
                p.catch(function () {
                    // 微信里通常是右上角菜单静音或系统静音键导致
                    toast(isWeixin
                        ? '🎵 若听不到音乐，请检查手机侧边的静音键'
                        : '🎵 点击右上角的按钮可以开启音乐', 5000);
                    syncMuteButton(true);
                });
            }
        }

        // 微信 WebView 需等桥就绪后才允许播放
        if (isWeixin && typeof WeixinJSBridge === 'undefined') {
            document.addEventListener('WeixinJSBridgeReady', attempt, false);
            // 桥迟迟不来时也照常尝试一次，避免永远没声音
            setTimeout(attempt, 1200);
        } else {
            attempt();
        }
    }


    document.getElementById('intro').addEventListener('click', start);

    // 画面点击：演出开始前用来启动，结束后用来切换爱心 ↔ 头像
    document.querySelector('.canvas').addEventListener('click', function () {
        if (!started) {
            start();
        } else {
            toggleShape();
        }
    });

    // ---------- 音乐开关 ----------

    function syncMuteButton(off) {
        var btn = document.getElementById('btn-mute');
        btn.firstChild.nodeValue = off ? '🔇 ' : '🔊 ';
        btn.querySelector('span').textContent = off ? '音乐关' : '音乐开';
    }

    document.getElementById('btn-mute').addEventListener('click', function (e) {
        e.stopPropagation();
        var audio = document.getElementById('audios');

        if (audio.paused) {
            // 之前被自动播放策略拦下了，这次是真实用户手势，重试
            audio.muted = false;
            var p = audio.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function () {
                    toast('🎵 浏览器不允许播放，请检查手机静音键');
                });
            }
            syncMuteButton(false);
        } else {
            audio.muted = !audio.muted;
            syncMuteButton(audio.muted);
        }
    });

    // ---------- 背景：舞台灯里的浮尘 ----------
    //
    // v1 这里画的是星空。星空是所有人的，直播间的暗场才是她的。
    // 现在改成"一束光里飘着的尘"：极慢地上升，越接近光源越亮，
    // 落到底部就自然淡掉。比星星安静，也更像一间开着摄像头的房间。

    (function () {
        var el = document.getElementById('stars');

        if (!(CONFIG.theme && CONFIG.theme.stars)) {
            el.style.display = 'none';
            return;
        }

        var ctx = el.getContext('2d'),
            motes = [],
            reduced = window.matchMedia &&
                      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function spawn(anywhere) {
            // 横向向中间聚：光锥里才看得见尘埃。
            // 三个随机数取平均 = 近似正态，中间密、两侧稀。
            var bias = (Math.random() + Math.random() + Math.random()) / 3;

            return {
                x: el.width * (0.06 + 0.88 * bias),
                y: anywhere ? Math.random() * el.height : el.height + 6,
                r: Math.random() * 0.9 + 0.35,
                a: Math.random() * 0.45 + 0.12,
                v: Math.random() * 0.11 + 0.03,     // 上升速度，像素/帧
                sway: Math.random() * Math.PI * 2,  // 横向摆动相位
                amp: Math.random() * 0.5 + 0.2
            };
        }

        function seed() {
            el.width = el.clientWidth;
            el.height = el.clientHeight;
            motes = [];

            // 数量随面积缩放；比星空稀得多，尘埃本来就该少
            var count = Math.round(el.width * el.height / 14000);
            for (var i = 0; i < count; i++) motes.push(spawn(true));
        }

        function draw() {
            ctx.clearRect(0, 0, el.width, el.height);

            for (var i = 0; i < motes.length; i++) {
                var m = motes[i];

                m.y -= m.v;
                m.sway += 0.006;

                if (m.y < -8) {
                    motes[i] = spawn(false);
                    continue;
                }

                // 越靠近画面中部越亮，顶部和底部都淡出
                var t = 1 - m.y / el.height,
                    fade = Math.sin(Math.PI * Math.min(1, Math.max(0, t))),
                    alpha = m.a * fade;

                if (alpha <= 0.01) continue;

                ctx.globalAlpha = alpha;
                // 大部分是暖金，少量红 —— 红的密度一高就变成"特效"了
                ctx.fillStyle = (i % 4 === 0) ? '#FF5546' : '#FFD9A8';
                ctx.beginPath();
                ctx.arc(m.x + Math.sin(m.sway) * m.amp, m.y, m.r, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.globalAlpha = 1;

            if (!reduced) requestAnimationFrame(draw);
        }

        seed();
        window.addEventListener('resize', seed);
        draw();
    }());
</script>

<script>
    // ---------- 3D 透视烟花 ----------
    // 源自 cantelope.org 的 NYE 效果

    function initVars(){

        pi=Math.PI;
        ctx=canvas.getContext("2d");
        canvas.width=canvas.clientWidth;
        canvas.height=canvas.clientHeight;
        cx=canvas.width/2;
        cy=canvas.height/2;
        playerZ=-25;
        playerX=playerY=playerVX=playerVY=playerVZ=pitch=yaw=pitchV=yawV=0;
        scale=600;
        seedTimer=0;seedInterval=5,seedLife=100;gravity=.02;
        seeds=new Array();
        sparkPics=new Array();
        s = "./NYE/";

        // 十张 spark 贴图是十年前的彩虹配色，跟这一版的辣椒红打架。
        // 以前是给整个 #canvas 加 CSS 滤镜压成暖金，但那等于让浏览器
        // 每帧重算一次全屏颜色矩阵：实测 61fps → 29fps，烟花一停立刻回到 61。
        // 改成加载时把每张贴图烘一遍，颜色落到像素上，之后绘制零额外开销。
        var TINT = 'sepia(0.88) saturate(1.6)';

        function tintSpark(img, idx){
            if(!img.naturalWidth || !sparkPics.length) return;
            var c=document.createElement('canvas');
            c.width=img.naturalWidth;
            c.height=img.naturalHeight;
            var g=c.getContext('2d');
            g.filter=TINT;
            g.drawImage(img,0,0);
            sparkPics[idx]=c;
        }

        for(i=1;i<=10;++i){
            sparkPic=new Image();
            // 先占位：图没加载完之前要是已经开始放烟花，会拿到 Image，
            // 颜色偏彩虹但能画；load 完就地换成烘好的版本。
            sparkPic.onload=(function(index){
                return function(){ tintSpark(this, index); };
            }(i-1));
            sparkPic.src=s+"spark"+i+".png";
            sparkPics.push(sparkPic);
        }
        sparks=new Array();
        frames = 0;
        running = false;

        // 手机 GPU 较弱：降低火花数量与地面网格密度，保住帧率
        sparkCap    = isMobile ? 70  : 150;
        gridStepX   = isMobile ? 5   : 3;
        gridStepZ   = isMobile ? 6   : 4;
    }

    function rasterizePoint(x,y,z){

        var p,d;
        x-=playerX;
        y-=playerY;
        z-=playerZ;
        p=Math.atan2(x,z);
        d=Math.sqrt(x*x+z*z);
        x=Math.sin(p-yaw)*d;
        z=Math.cos(p-yaw)*d;
        p=Math.atan2(y,z);
        d=Math.sqrt(y*y+z*z);
        y=Math.sin(p-pitch)*d;
        z=Math.cos(p-pitch)*d;
        var rx1=-1000,ry1=1,rx2=1000,ry2=1,rx3=0,ry3=0,rx4=x,ry4=z,uc=(ry4-ry3)*(rx2-rx1)-(rx4-rx3)*(ry2-ry1);
        if(!uc) return {x:0,y:0,d:-1};
        var ua=((rx4-rx3)*(ry1-ry3)-(ry4-ry3)*(rx1-rx3))/uc;
        var ub=((rx2-rx1)*(ry1-ry3)-(ry2-ry1)*(rx1-rx3))/uc;
        if(!z)z=.000000001;
        if(ua>0&&ua<1&&ub>0&&ub<1){
            return {
                x:cx+(rx1+ua*(rx2-rx1))*scale,
                y:cy+y/z*scale,
                d:Math.sqrt(x*x+y*y+z*z)
            };
        }else{
            return {
                x:cx+(rx1+ua*(rx2-rx1))*scale,
                y:cy+y/z*scale,
                d:-1
            };
        }
    }

    function spawnSeed(){

        seed=new Object();
        seed.x=-50+Math.random()*100;
        seed.y=25;
        seed.z=-50+Math.random()*100;
        seed.vx=.1-Math.random()*.2;
        seed.vy=-1.5;
        seed.vz=.1-Math.random()*.2;
        seed.born=frames;
        seeds.push(seed);
    }

    function splode(x,y,z){

        t=5+parseInt(Math.random()*sparkCap);
        sparkV=1+Math.random()*2.5;
        type=parseInt(Math.random()*3);
        switch(type){
            case 0:
                pic1=parseInt(Math.random()*10);
                break;
            case 1:
                pic1=parseInt(Math.random()*10);
                do{ pic2=parseInt(Math.random()*10); }while(pic2==pic1);
                break;
            case 2:
                pic1=parseInt(Math.random()*10);
                do{ pic2=parseInt(Math.random()*10); }while(pic2==pic1);
                do{ pic3=parseInt(Math.random()*10); }while(pic3==pic1 || pic3==pic2);
                break;
        }
        for(m=1;m<t;++m){
            spark=new Object();
            spark.x=x; spark.y=y; spark.z=z;
            p1=pi*2*Math.random();
            p2=pi*Math.random();
            v=sparkV*(1+Math.random()/6)
            spark.vx=Math.sin(p1)*Math.sin(p2)*v;
            spark.vz=Math.cos(p1)*Math.sin(p2)*v;
            spark.vy=Math.cos(p2)*v;
            switch(type){
                case 0: spark.img=sparkPics[pic1]; break;
                case 1:
                    spark.img=sparkPics[parseInt(Math.random()*2)?pic1:pic2];
                    break;
                case 2:
                    switch(parseInt(Math.random()*3)){
                        case 0: spark.img=sparkPics[pic1]; break;
                        case 1: spark.img=sparkPics[pic2]; break;
                        case 2: spark.img=sparkPics[pic3]; break;
                    }
                    break;
            }
            spark.radius=25+Math.random()*50;
            spark.alpha=1;
            spark.trail=new Array();
            sparks.push(spark);
        }

        // 爆炸音效只在用户已交互后播放，否则会被浏览器策略拦截并刷满控制台
        if(started){
            switch(parseInt(Math.random()*4)){
                case 0:	pow=new Audio(s+"pow1.ogg"); break;
                case 1:	pow=new Audio(s+"pow2.ogg"); break;
                case 2:	pow=new Audio(s+"pow3.ogg"); break;
                case 3:	pow=new Audio(s+"pow4.ogg"); break;
            }
            d=Math.sqrt((x-playerX)*(x-playerX)+(y-playerY)*(y-playerY)+(z-playerZ)*(z-playerZ));
            pow.volume=Math.min(1, 1.5/(1+d/10));
            if(document.getElementById('audios').muted) pow.volume=0;
            var promise=pow.play();
            if(promise && typeof promise.catch === 'function') promise.catch(function(){});
        }
    }

    function doLogic(){

        if(seedTimer<frames){
            seedTimer=frames+seedInterval*Math.random()*10;
            spawnSeed();
        }
        for(i=0;i<seeds.length;++i){
            seeds[i].vy+=gravity;
            seeds[i].x+=seeds[i].vx;
            seeds[i].y+=seeds[i].vy;
            seeds[i].z+=seeds[i].vz;
            if(frames-seeds[i].born>seedLife){
                splode(seeds[i].x,seeds[i].y,seeds[i].z);
                seeds.splice(i,1);
            }
        }
        for(i=0;i<sparks.length;++i){
            if(sparks[i].alpha>0 && sparks[i].radius>5){
                sparks[i].alpha-=.01;
                sparks[i].radius/=1.02;
                sparks[i].vy+=gravity;
                point=new Object();
                point.x=sparks[i].x;
                point.y=sparks[i].y;
                point.z=sparks[i].z;
                if(sparks[i].trail.length){
                    x=sparks[i].trail[sparks[i].trail.length-1].x;
                    y=sparks[i].trail[sparks[i].trail.length-1].y;
                    z=sparks[i].trail[sparks[i].trail.length-1].z;
                    d=((point.x-x)*(point.x-x)+(point.y-y)*(point.y-y)+(point.z-z)*(point.z-z));
                    if(d>9){
                        sparks[i].trail.push(point);
                    }
                }else{
                    sparks[i].trail.push(point);
                }
                if(sparks[i].trail.length>5)sparks[i].trail.splice(0,1);
                sparks[i].x+=sparks[i].vx;
                sparks[i].y+=sparks[i].vy;
                sparks[i].z+=sparks[i].vz;
                sparks[i].vx/=1.075;
                sparks[i].vy/=1.075;
                sparks[i].vz/=1.075;
            }else{
                sparks.splice(i,1);
            }
        }
        p=Math.atan2(playerX,playerZ);
        d=Math.sqrt(playerX*playerX+playerZ*playerZ);
        d+=Math.sin(frames/80)/1.25;
        t=Math.sin(frames/200)/40;
        playerX=Math.sin(p+t)*d;
        playerZ=Math.cos(p+t)*d;
        yaw=pi+p+t;
    }

    function draw(){

        ctx.clearRect(0,0,cx*2,cy*2);

        ctx.fillStyle="#FFA53D";
        for(i=-100;i<100;i+=gridStepX){
            for(j=-100;j<100;j+=gridStepZ){
                x=i;z=j;y=25;
                point=rasterizePoint(x,y,z);
                if(point.d!=-1){
                    size=250/(1+point.d);
                    d = Math.sqrt(x * x + z * z);
                    a = 0.5 - Math.pow(d / 100, 6) * 0.5;
                    if(a>0){
                        ctx.globalAlpha = a;
                        ctx.fillRect(point.x-size/2,point.y-size/2,size,size);
                    }
                }
            }
        }
        ctx.globalAlpha=1;
        for(i=0;i<seeds.length;++i){
            point=rasterizePoint(seeds[i].x,seeds[i].y,seeds[i].z);
            if(point.d!=-1){
                size=200/(1+point.d);
                ctx.fillRect(point.x-size/2,point.y-size/2,size,size);
            }
        }
        point1=new Object();
        for(i=0;i<sparks.length;++i){
            point=rasterizePoint(sparks[i].x,sparks[i].y,sparks[i].z);
            if(point.d!=-1){
                size=sparks[i].radius*200/(1+point.d);
                if(sparks[i].alpha<0)sparks[i].alpha=0;
                if(sparks[i].trail.length){
                    point1.x=point.x;
                    point1.y=point.y;
                    switch(sparks[i].img){
                        case sparkPics[0]:ctx.strokeStyle="#f84";break;
                        case sparkPics[1]:ctx.strokeStyle="#84f";break;
                        case sparkPics[2]:ctx.strokeStyle="#8ff";break;
                        case sparkPics[3]:ctx.strokeStyle="#FFF4E6";break;
                        case sparkPics[4]:ctx.strokeStyle="#4f8";break;
                        case sparkPics[5]:ctx.strokeStyle="#f44";break;
                        case sparkPics[6]:ctx.strokeStyle="#f84";break;
                        case sparkPics[7]:ctx.strokeStyle="#84f";break;
                        case sparkPics[8]:ctx.strokeStyle="#FFF4E6";break;
                        case sparkPics[9]:ctx.strokeStyle="#44f";break;
                    }
                    for(j=sparks[i].trail.length-1;j>=0;--j){
                        point2=rasterizePoint(sparks[i].trail[j].x,sparks[i].trail[j].y,sparks[i].trail[j].z);
                        if(point2.d!=-1){
                            ctx.globalAlpha=j/sparks[i].trail.length*sparks[i].alpha/2;
                            ctx.beginPath();
                            ctx.moveTo(point1.x,point1.y);
                            ctx.lineWidth=1+sparks[i].radius*10/(sparks[i].trail.length-j)/(1+point2.d);
                            ctx.lineTo(point2.x,point2.y);
                            ctx.stroke();
                            point1.x=point2.x;
                            point1.y=point2.y;
                        }
                    }
                }
                ctx.globalAlpha=sparks[i].alpha;
                ctx.drawImage(sparks[i].img,point.x-size/2,point.y-size/2,size,size);
            }
        }
    }

    function frame(){

        if(frames>100000){
            seedTimer=0;
            frames=0;
        }
        frames++;
        draw();
        doLogic();
        requestAnimationFrame(frame);
    }

    // 只允许启动一条 rAF 链，否则 frames 每帧递增两次，烟花速度与密度会翻倍
    function startFireworks(){
        if(running) return;
        running = true;
        frame();
    }

    window.addEventListener("resize",()=>{
        canvas.width=canvas.clientWidth;
        canvas.height=canvas.clientHeight;
        cx=canvas.width/2;
        cy=canvas.height/2;
    });

    // ---------- 头像入场特效 ----------
    // 由 js/index.js 的 #portrait 指令回调触发：白光闪一下 + 烟花齐放。

    window.onPortraitReveal = function () {
        // 白光：重放动画需要先移除 class 并强制重排
        var flash = document.getElementById('flash');
        flash.classList.remove('flash--on');
        void flash.offsetWidth;
        flash.classList.add('flash--on');

        // 烟花齐放：在观众上方一圈同时炸开，把视线托起来
        var burst = isMobile ? 4 : 7;

        for (var k = 0; k < burst; k++) {
            (function (i) {
                setTimeout(function () {
                    var ang = (Math.PI * 2 / burst) * i + Math.random() * 0.5,
                        rad = 22 + Math.random() * 26;

                    // y 轴向上为负，-15 左右是画面偏上的位置
                    splode(Math.cos(ang) * rad, -12 - Math.random() * 14, Math.sin(ang) * rad);
                }, i * 130 + Math.random() * 90);
            }(k));
        }
    };

    initVars();
    startFireworks();
</script>

<script src="js/index.js"></script>
<script>
    // ---------- 页面分流：倒数页 or 生日演出 ----------
    //
    // 非生日期间显示倒数页；生日当天（及之后 celebrateDays 天内）
    // 显示引导层，点击后进入完整演出。
    // 加 ?celebrate 参数可强制预览演出，方便调试。

    (function () {
        var force = /[?&]celebrate\b/.test(window.location.search),
            celebrating = force || HB.isCelebrating();

        if (celebrating) return;   // 走原有的引导层流程

        var intro = document.getElementById('intro'),
            page = document.getElementById('countdown-page'),
            days = HB.daysUntilBirthday(),
            cd = SITE.countdownPage || {};

        // 倒数页取代引导层
        intro.style.display = 'none';
        page.classList.add('cd--visible');

        document.getElementById('cd-label').textContent = SITE.fill(cd.title || '');
        document.getElementById('cd-status').textContent = days === 0 ? '开播了' : '未开播';

        if (days === 0) {
            // 生日当天但已过庆祝期（celebrateDays 设为 0 时才可能）
            document.getElementById('cd-number').style.display = 'none';
            document.getElementById('cd-today').textContent = cd.todayText || '就是今天';
        } else {
            document.getElementById('cd-today').style.display = 'none';
            document.getElementById('cd-days').textContent = days;
            document.getElementById('cd-unit').textContent = cd.unit || '天';
        }

        // 倒数页也放点音乐控制，但不自动播放
        document.body.classList.add('countdown-mode');
    }());

    // 粒子文字引擎需要 DOM 就绪后再初始化待机画面。
    //
    // 若用户抢在 load 之前就点了（图片没加载完时很常见），
    // 演出已经开始，这时再 init(1) 会把它重置回待机图标 —— 必须跳过。
    window.addEventListener('load', function () {
        if (started) return;

        // ?auto 供开发调试：跳过引导层直接开演，便于无头浏览器截图。
        // 可配合 ?a=#portrait 直接定位到指定的一帧。
        if (/[?&]auto\b/.test(window.location.search)) {
            start();
            return;
        }

        init(1);
    });
</script>
